# Render blueprint: one web service that polls civicAPI and serves the
# projection + runoff simulation. Same reasoning as the prior MN/MI/WI/SD
# builds -- see README.md.
#
# Layout is flat: every file sits at the repository root, including the site
# files, because GitHub's web uploader does not preserve folders.

services:
  - type: web
    name: sc-senate-gop-primary-model
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: RACE_ID
        value: "86330"  # 2026 South Carolina US Senate Special --
                        # civicapi.org/results/elections/86330. Confirmed
                        # to EXIST but NOT verified against the raw
                        # /api/v2/race/86330 payload (results page is a
                        # client-rendered SPA); the title says "Special"
                        # not "Primary" -- almost certainly right, since SC
                        # specials run their own primary phase, but watch
                        # the first deploy's logs closely (DEPLOY.md 2.3)
                        # to confirm the candidate match before trusting it.
      - key: N_SIMS
        value: "20000"
      - key: POLL_INTERVAL
        value: "60"
      - key: AIKEN_SOS_ENABLED
        value: "true"  # Overrides Aiken County's results with South
                       # Carolina's own SOS Election Night Reporting feed
                       # (aiken_sos_feed.py) instead of civicAPI, which is
                       # known to glitch for that one county. UNVERIFIED
                       # endpoint -- watch the first deploy's logs for
                       # "Aiken SOS override applied" vs "Aiken SOS feed
                       # failed"; set to "false" to fall back to civicAPI
                       # for Aiken if the SOS feed turns out not to work.

      # Optional. Set this to a mounted Render disk path (for example /var/data) if
      # you want county turnout/reporting state to survive a restart.
      # - key: STATE_DIR
      #   value: /var/data
